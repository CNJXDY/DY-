<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 页面未找到 - 万能工具箱</title>
<meta name="theme-color" content="#6366f1">
<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --border: #334155;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
}
.container { padding: 40px 20px; max-width: 500px; }
.code {
  font-size: 120px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 10px;
}
h1 { font-size: 24px; margin-bottom: 12px; }
p { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  font-weight: 500;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  margin-left: 10px;
}
.btn-secondary:hover { background: var(--border); }
.links { margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13px;
  padding: 6px 14px;
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.links a:hover { color: var(--accent-hover); border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <h1>页面未找到</h1>
  <p>你访问的页面不存在或已被移动。<br>别担心，试试下面的工具吧！</p>
  <a href="/DY-/" class="btn">🏠 返回首页</a>
  <a href="/DY-/blog/" class="btn btn-secondary">📖 浏览博客</a>
  <div class="links">
    <a href="/DY-/">JSON格式化</a>
    <a href="/DY-/">二维码生成</a>
    <a href="/DY-/">密码生成</a>
    <a href="/DY-/">进制转换</a>
    <a href="/DY-/">CSS格式化</a>
    <a href="/DY-/">SQL格式化</a>
  </div>
</div>
</body>
</html>
