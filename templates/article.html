<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{summary}}">
    <meta name="keywords" content="{{keywords}}">
    <meta property="og:title" content="{{title}} - 每日创富博客">
    <meta property="og:description" content="{{summary}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://{{github_username}}.github.io/{{repo_name}}/{{article_file}}">
    <title>{{title}} - 每日创富博客</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-secondary: #636e72;
            --accent: #0984e3;
            --accent-hover: #0767b3;
            --border: #e1e4e8;
            --tag-bg: #e8f4fd;
            --tag-text: #0984e3;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        header nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95em;
        }
        header nav a:hover { color: var(--accent); }
        .breadcrumb {
            padding: 15px 0;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        article {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        article h1 {
            font-size: 2em;
            line-height: 1.4;
            margin-bottom: 15px;
            color: var(--text);
        }
        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .article-meta .category {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        article h2 {
            font-size: 1.5em;
            margin: 30px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
        }
        article h3 {
            font-size: 1.25em;
            margin: 25px 0 12px;
        }
        article p {
            margin-bottom: 16px;
            text-align: justify;
        }
        article ul, article ol {
            margin: 10px 0 20px 25px;
        }
        article li {
            margin-bottom: 8px;
        }
        article .highlight-box {
            background: #f0f7ff;
            border-left: 4px solid var(--accent);
            padding: 20px 25px;
            margin: 25px 0;
            border-radius: 0 8px 8px 0;
        }
        article .highlight-box p { margin: 0; }
        article .tips-list {
            list-style: none;
            padding: 0;
        }
        article .tips-list li {
            background: #f8f9fa;
            margin-bottom: 10px;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        article .tips-list li strong {
            color: var(--accent);
        }
        .share-section {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }
        .share-section p {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.9em;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            article { padding: 20px; }
            article h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">&#x1F4B0; 每日创富博客</a>
            <nav>
                <a href="index.html">首页</a>
                <a href="index.html#articles">文章</a>
                <a href="index.html#about">关于</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <div class="breadcrumb">
            <a href="index.html">首页</a> &raquo; <span>{{title}}</span>
        </div>
        <article>
            <h1>{{title}}</h1>
            <div class="article-meta">
                <span>&#x1F4C5; {{date}}</span>
                <span class="category">{{category}}</span>
                <span>&#x23F1; 阅读约 {{read_time}} 分钟</span>
            </div>
            {{content}}
        </article>
        <div class="share-section">
            <p>&#x1F4A1; 觉得有用？分享给朋友，一起成长！</p>
            <p style="font-size: 0.85em; color: #b2bec3;">每日创富博客 - 每天一篇好文章，陪你一起成长</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 每日创富博客 | 坚持每日更新，靠SEO累积流量</p>
        <p style="margin-top: 5px;">本博客由AI全自动生成并发布，每天推送一篇新的SEO优化文章</p>
    </footer>
</body>
</html>
